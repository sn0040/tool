<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover"/>
  <title>《铃兰之剑》角色梯度排行工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      background: #121212;
      color: #fff;
      padding: 20px;
    }

    .title-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 26px;
      color: #ffcc00;
      margin-bottom: 10px;
      font-weight: bold;
    }

    #screenshotBtn {
      padding: 8px 20px;
      background: #ff3333;
      color: #fff;
      border: none;
      border-radius: 40px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    #screenshotBtn:hover {
      background: #ff6666;
      transform: scale(1.02);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .pool {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: #1e1e1e;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      min-height: 150px;
      border: 1px solid #333;
    }

    .tier-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tier-row {
      display: flex;
      align-items: stretch;
      background: #222;
      border-radius: 12px;
      overflow: hidden;
      min-height: 130px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .tier-label {
      width: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      flex-shrink: 0;
      text-shadow: 0 1px 2px black;
      text-align: center;
      flex-direction: column;
      line-height: 1.2;
    }

    .tier-label.t0 { background: #ff3333; }
    .tier-label.t1 { background: #ff7722; }
    .tier-label.t2 { background: #ffcc00; color:#1e1e1e; }
    .tier-label.t3 { background: #33bb55; }
    .tier-label.t4 { background: #4488ff; }
    .tier-label.trash { background: #777; }

    .tier-content {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      background: #2a2a2a;
      min-height: 130px;
    }

    /* 电脑端默认大尺寸卡片 */
    .char-card {
      width: 100px !important;
      height: 110px !important;
      min-width: 100px !important;
      min-height: 110px !important;
      background: #2c2c2c;
      border: 2px solid #5a5a5a;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
      transition: 0.1s;
      overflow: hidden;
      flex-shrink: 0 !important;
      touch-action: pan-y;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .char-card:active {
      cursor: grabbing;
      transform: scale(0.98);
    }

    .char-card:hover {
      border-color: #ffcc00;
      background: #3a3a3a;
    }

    .char-card img {
      width: 65px !important;
      height: 65px !important;
      min-width: 65px !important;
      min-height: 65px !important;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      flex-shrink: 0;
      background: #1e1e1e;
    }

    .char-name {
      font-size: 12px;
      margin-top: 6px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90px;
      text-align: center;
      color: #f0f0f0;
    }

    .tip {
      text-align: center;
      margin-top: 20px;
      color: #aaa;
      font-size: 13px;
      border-top: 1px solid #2c2c2c;
      padding-top: 16px;
      margin-bottom: 30px;
    }

    /* 截图预览浮层 */
    .preview-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      touch-action: none;
    }
    .preview-container {
      max-width: 90%;
      max-height: 80%;
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .preview-img {
      max-width: 100%;
      max-height: 55vh;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }
    .preview-tip {
      margin-top: 12px;
      color: #333;
      font-size: 13px;
      font-weight: 500;
    }
    .close-preview {
      margin-top: 16px;
      padding: 6px 20px;
      background: #ff3333;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 13px;
      cursor: pointer;
    }

    /* 手机端紧凑样式 */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      .title {
        font-size: 20px;
        margin-bottom: 8px;
      }
      #screenshotBtn {
        padding: 6px 16px;
        font-size: 13px;
      }
      .pool {
        gap: 6px;
        padding: 8px;
        margin-bottom: 16px;
        min-height: 100px;
      }
      .tier-list {
        gap: 8px;
      }
      .tier-row {
        min-height: 75px;
        border-radius: 10px;
      }
      .tier-label {
        width: 48px;
        font-size: 14px;
      }
      .tier-content {
        padding: 6px;
        gap: 5px;
        min-height: 75px;
      }
      .char-card {
        width: 60px !important;
        height: 70px !important;
        min-width: 60px !important;
        min-height: 70px !important;
        border-width: 1.5px;
      }
      .char-card img {
        width: 42px !important;
        height: 42px !important;
        min-width: 42px !important;
        min-height: 42px !important;
      }
      .char-name {
        font-size: 9px;
        margin-top: 3px;
        max-width: 54px;
      }
      .tip {
        font-size: 10px;
        margin-top: 12px;
        padding-top: 10px;
        margin-bottom: 20px;
      }
    }

    @media (max-width: 480px) {
      .char-card {
        width: 55px !important;
        height: 65px !important;
      }
      .char-card img {
        width: 38px !important;
        height: 38px !important;
      }
      .char-name {
        font-size: 8px;
        max-width: 50px;
      }
      .tier-label {
        width: 42px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="title-box">
    <div class="title">🎖️ 角色梯度排行工具</div>
    <button id="screenshotBtn">📸 截图保存梯度榜</button>
  </div>

  <div class="container">
    <div class="pool" id="pool"></div>
    <div class="tier-list" id="captureArea">
      <div class="tier-row"><div class="tier-label t0">T0</div><div class="tier-content"></div></div>
      <div class="tier-row"><div class="tier-label t1">T1</div><div class="tier-content"></div></div>
      <div class="tier-row"><div class="tier-label t2">T2</div><div class="tier-content"></div></div>
      <div class="tier-row"><div class="tier-label t3">T3</div><div class="tier-content"></div></div>
      <div class="tier-row"><div class="tier-label t4">T4</div><div class="tier-content"></div></div>
      <div class="tier-row"><div class="tier-label trash">💀<br>下水道</div><div class="tier-content"></div></div>
    </div>
    <div class="tip">
      📢 by：铃兰之剑 - 爱与和平公会 | 公会收人联系方式V: KZFVIP
    </div>
  </div>

  <script>
    if (typeof html2canvas === 'undefined') {
      alert("❌ 截图库加载失败，请刷新页面");
      document.getElementById('screenshotBtn').disabled = true;
    }

    // ---------- 角色数据 ----------
    const imageFiles = [
      "001.png","002.png","003.png","004.png","005.png","006.png","007.png","008.png","009.png","010.png",
      "011.png","012.png","013.png","014.png","015.png","016.png","017.png","018.png","019.png","020.png",
      "021.png","022.png","023.png","024.png","025.png","026.png","027.png","028.png","029.png","030.png",
      "031.png","032.png","033.png","034.png","035.png","036.png","037.png","038.png","039.png","040.png",
      "041.png","042.png","043.png","044.png","045.png","046.png","047.png","048.png","049.png","050.png",
      "051.png","052.png","053.png","054.png","055.png","056.png","057.png","058.png","059.png","060.png",
      "061.png","062.png","063.png","064.png","065.png","066.png","067.png","068.png","069.png","070.png",
      "071.png","072.png","073.png","074.png","075.png","076.png","077.png","078.png","079.png","080.png","081.png",
      "082.png"
    ];

    const characterNames = [
      "麦莎","拉维耶","法卡尔","贝拉","歌洛莉亚","泰登","伊南娜","迪塔利奥","马格努斯","泽维尔",
      "米格尔","科尔","萨曼莎","列奥尼德","嘉西娅","古兹曼","莉莉薇儿","诺诺薇儿","伊奇","内尔伽勒",
      "伦伽勒","艾达","茉茉","阿列克谢","席梦娜","索菲亚","奥古斯特","蔻蔻娜","阿坎贝","哈斯娜",
      "霍玛","卡丽丝","夏可露露","阿加塔","塔埃尔","拉维耶·初夏记忆","帕米娜","翠斯坦","莉拉","索菲亚·夏日约定",
      "奇亚","柯瓦雷","露维塔","伊斯特拉","芙拉维娅","流星队","鲁特菲","爱莎","阿芙拉","伊南娜·铃兰之剑",
      "妮蒂娅","森西","玛露西尔","法琳","黎各","柯莱丹萨","帕西法尔","萨曼莎·不灭微光","伊瑟琳德","全装甲麦莎",
      "卡姆洛特","法卡尔·卫国之箭","伦伽勒·传承之枪","露卡玛尔","波奇茸茸","沙姆斯","克拉拉","赛琳娜","叶迦内","赫砂",
      "沙娜姿","基安希尔","希里","杰洛特","叶奈法","特莉丝","安娜","阿列克谢·风雪孤行","罗格妮达","乌莉娅","伊凡",
      "芬恩"
    ];

    const pool = document.getElementById("pool");

    function createCharacterCard(imgSrc, name) {
      const card = document.createElement("div");
      card.className = "char-card";
      card.setAttribute("data-name", name);
      card.draggable = true;
      
      const img = document.createElement("img");
      img.src = imgSrc;
      img.alt = name;
      img.onerror = function() {
        this.style.display = 'none';
        const fallback = document.createElement('div');
        fallback.style.cssText = `width:65px;height:65px;background:#3a3a3a;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:12px;`;
        fallback.textContent = '🖼️';
        card.insertBefore(fallback, this);
      };
      const nameEl = document.createElement("div");
      nameEl.className = "char-name";
      nameEl.textContent = name;
      card.appendChild(img);
      card.appendChild(nameEl);
      return card;
    }

    imageFiles.forEach((file, idx) => {
      const card = createCharacterCard(`./assets/${file}`, characterNames[idx]);
      pool.appendChild(card);
    });

    // 拖拽变量
    let draggingCard = null;

    // 鼠标拖拽
    document.addEventListener("dragstart", (e) => {
      const card = e.target.closest(".char-card");
      if (!card) return;
      draggingCard = card;
      setTimeout(() => { if (card) card.style.opacity = "0.5"; }, 0);
      e.dataTransfer.effectAllowed = "move";
    });
    document.addEventListener("dragend", (e) => {
      if (draggingCard) {
        draggingCard.style.opacity = "1";
        draggingCard = null;
      }
    });
    document.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (!draggingCard) return;
      const targetCard = e.target.closest(".char-card");
      const container = e.target.closest(".pool, .tier-content");
      if (!container) return;
      if (!targetCard) {
        container.appendChild(draggingCard);
        return;
      }
      const rect = targetCard.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const isRightHalf = mouseX > rect.width / 2;
      if (isRightHalf) {
        container.insertBefore(draggingCard, targetCard.nextElementSibling);
      } else {
        container.insertBefore(draggingCard, targetCard);
      }
    });
    document.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation();
    });

    // 手机触摸拖拽 + 自动滚动
    let scrollInterval = null;
    function stopAutoScroll() {
      if (scrollInterval) {
        clearInterval(scrollInterval);
        scrollInterval = null;
      }
    }
    function startAutoScroll(direction) {
      if (scrollInterval) stopAutoScroll();
      scrollInterval = setInterval(() => {
        if (!draggingCard) {
          stopAutoScroll();
          return;
        }
        const speed = 14;
        window.scrollBy(0, direction * speed);
      }, 16);
    }

    function initTouchDrag() {
      const cards = document.querySelectorAll('.char-card');
      cards.forEach(card => {
        let touchStartX = 0, touchStartY = 0;
        card.addEventListener('touchstart', (e) => {
          e.preventDefault();
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          card.style.opacity = "0.6";
          draggingCard = card;
        }, { passive: false });
        
        card.addEventListener('touchmove', (e) => {
          if (!draggingCard) return;
          const touch = e.touches[0];
          const clientY = touch.clientY;
          const threshold = 75;
          let speed = 0;
          
          if (clientY < threshold) {
            speed = -Math.min(18, (threshold - clientY) / 3);
          } else if (clientY > window.innerHeight - threshold) {
            speed = Math.min(18, (clientY - (window.innerHeight - threshold)) / 3);
          }
          
          if (speed !== 0) {
            if (!scrollInterval) startAutoScroll(speed > 0 ? 1 : -1);
            e.preventDefault();
            return;
          } else {
            stopAutoScroll();
          }
          
          const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
          const container = targetEl?.closest(".pool, .tier-content");
          const targetCard = targetEl?.closest(".char-card");
          if (container) {
            if (!targetCard) {
              container.appendChild(draggingCard);
            } else {
              const rect = targetCard.getBoundingClientRect();
              const isRightHalf = (touch.clientX - rect.left) > (rect.width / 2);
              if (isRightHalf) {
                container.insertBefore(draggingCard, targetCard.nextElementSibling);
              } else {
                container.insertBefore(draggingCard, targetCard);
              }
            }
          }
        }, { passive: false });
        
        card.addEventListener('touchend', (e) => {
          e.preventDefault();
          if (draggingCard) {
            draggingCard.style.opacity = "1";
            draggingCard = null;
          }
          stopAutoScroll();
        });
      });
    }
    initTouchDrag();

    // ========== 截图修复：解决图片变形 ==========
    async function preloadImagesInfo() {
      const allCards = Array.from(document.querySelectorAll('.char-card'));
      const imgDataMap = new Map();
      for (let card of allCards) {
        const img = card.querySelector('img');
        if (!img || !img.src || img.naturalWidth === 0) continue;
        const rect = img.getBoundingClientRect();
        const displayW = rect.width;
        const displayH = rect.height;
        const naturalW = img.naturalWidth;
        const naturalH = img.naturalHeight;
        if (naturalW > 0 && naturalH > 0 && displayW > 0 && displayH > 0) {
          imgDataMap.set(img.src, { naturalW, naturalH, displayW, displayH });
        }
      }
      return imgDataMap;
    }

    function fixImagesInClone(cloneDoc, imgDataMap) {
      const cloneImgs = cloneDoc.querySelectorAll('.char-card img');
      cloneImgs.forEach(img => {
        const src = img.src;
        const info = imgDataMap.get(src);
        if (!info) return;
        const { naturalW, naturalH, displayW, displayH } = info;
        if (naturalW <= 0 || naturalH <= 0) return;
        
        const targetW = displayW;
        const targetH = displayH;
        const scaleW = targetW / naturalW;
        const scaleH = targetH / naturalH;
        const scale = Math.max(scaleW, scaleH);
        const drawW = naturalW * scale;
        const drawH = naturalH * scale;
        const offsetX = (targetW - drawW) / 2;
        const offsetY = (targetH - drawH) / 2;
        
        const canvas = document.createElement('canvas');
        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        try {
          const tempImg = new Image();
          tempImg.crossOrigin = "Anonymous";
          tempImg.src = src;
          if (tempImg.complete && tempImg.naturalWidth > 0) {
            ctx.drawImage(tempImg, offsetX, offsetY, drawW, drawH);
            img.src = canvas.toDataURL('image/png');
          } else {
            tempImg.onload = () => {
              ctx.drawImage(tempImg, offsetX, offsetY, drawW, drawH);
              img.src = canvas.toDataURL('image/png');
            };
          }
        } catch(e) { console.warn(e); }
        img.style.objectFit = 'fill';
        img.style.width = targetW + 'px';
        img.style.height = targetH + 'px';
      });
    }

    // 截图主函数（带变形修复）
    async function takeScreenshot() {
      if (typeof html2canvas === 'undefined') {
        alert("截图库未加载，请刷新页面");
        return;
      }
      const captureArea = document.getElementById("captureArea");
      if (!captureArea) return;
      
      const toast = document.createElement('div');
      toast.textContent = '📸 生成截图中...';
      toast.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#000000cc; color:#ffcc66; padding:6px 16px; border-radius:30px; font-size:12px; z-index:10000;';
      document.body.appendChild(toast);
      
      try {
        // 预加载所有图片的真实尺寸信息
        const imgDataMap = await preloadImagesInfo();
        const canvas = await html2canvas(captureArea, {
          backgroundColor: "#2a2a2a",
          logging: false,
          allowTaint: false,
          useCORS: true,
          scale: window.devicePixelRatio || 2,
          windowWidth: captureArea.scrollWidth,
          windowHeight: captureArea.scrollHeight,
          onclone: (clonedDoc, element) => {
            if (imgDataMap.size > 0) {
              fixImagesInClone(clonedDoc, imgDataMap);
            }
          }
        });
        const imgData = canvas.toDataURL("image/png");
        showPreviewModal(imgData);
      } catch (err) {
        console.error(err);
        alert("截图失败，请重试");
      } finally {
        toast.remove();
      }
    }
    
    function showPreviewModal(imgData) {
      const existing = document.querySelector('.preview-modal');
      if (existing) existing.remove();
      
      const modal = document.createElement('div');
      modal.className = 'preview-modal';
      const container = document.createElement('div');
      container.className = 'preview-container';
      
      const img = document.createElement('img');
      img.src = imgData;
      img.className = 'preview-img';
      
      const tip = document.createElement('div');
      tip.className = 'preview-tip';
      tip.textContent = '📸 长按图片保存到相册（电脑：右键→另存为）';
      
      const closeBtn = document.createElement('button');
      closeBtn.className = 'close-preview';
      closeBtn.textContent = '关闭';
      closeBtn.onclick = () => modal.remove();
      
      container.appendChild(img);
      container.appendChild(tip);
      container.appendChild(closeBtn);
      modal.appendChild(container);
      document.body.appendChild(modal);
    }
    
    document.getElementById("screenshotBtn").addEventListener("click", () => {
      takeScreenshot();
    });
    
    console.log("梯度工具已加载 | 截图变形已修复 | 提示已更新");
  </script>
</body>
</html>
